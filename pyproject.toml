[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breeze-widget"
version = "0.4.1"
description = "Clean-room Breeze widget toolkit for PySide6 desktop applications"
readme = "README.md"
license = "MIT"
authors = [{name = "Taron686"}]
maintainers = [{name = "Taron686"}]
requires-python = ">=3.11"
keywords = ["pyside6", "qt", "widgets", "desktop", "breeze", "ui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "PySide6>=6.6.0",
]

[project.urls]
Homepage = "https://github.com/Taron686/breeze-widget-public"
Repository = "https://github.com/Taron686/breeze-widget-public"
Documentation = "https://github.com/Taron686/breeze-widget-public#readme"
"Issue Tracker" = "https://github.com/Taron686/breeze-widget-public/issues"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-qt>=4.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"breezewidget.icons" = ["outline/*.svg"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
